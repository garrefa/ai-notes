# .config.yml — organization-specific settings for the ax-* skill toolkit, for ONE workspace.
#
# Copy this file to <notes repo>/.config.yml (the notes folder inside your workspace root) and fill
# in your own values, or run the ax-setup skill, which creates and updates it interactively.
# Every ax-* skill reads settings from here instead of hardcoding an organization's details, so
# the toolkit itself (skills, agents, hooks) never needs to change to adopt it for a new company/workspace.
#
# Neither the workspace root nor the notes folder is stored here or hardcoded into any skill. Skills
# find this file by walking up from the current directory, checking each directory and its immediate
# subfolders for a `.config.yml` whose `kind` is `ainotes-config` (the line below — keep it first).
# The folder holding it IS the notes repo and that folder's parent is the workspace root, so renaming
# the notes folder needs no edit here. That's what lets one global ainotes installation serve
# multiple independent workspaces at once, each with its own notes repo and settings. A legacy
# <workspace>/.ai-notes/config.yml is still read until install.sh migrates it here.
#
# This file is tracked with the notes repo; keep secrets out of it. Untracked runtime files (caches,
# logs, the rename tracker) live in <notes repo>/.state/.
#
# Optional keys can be left null/empty or removed entirely; every skill degrades gracefully when one
# is missing (it skips the step that needs it and tells you how to enable it).

kind: ainotes-config

# Human-readable org name, used only in skill-generated prose where it reads naturally — e.g. the
# ax-report title ("Acme work report — 2026-Q3") and the intro line of an
# ax-pr-review-request Slack message. Optional; purely cosmetic.
org_name: "Acme"

vcs:
  # GitHub org or user the workspace's repos live under — what `gh` calls use as the owner (e.g.
  # `gh pr view <n> --repo <org>/<repo>`). GitHub is the only supported VCS.
  org: acme

# OPTIONAL — disabled by default. With no `jira` block every Jira step is skipped: no ticket
# creation or linking, and no skill will ever ask you for a ticket. Uncomment to enable Jira.
# jira:
#   # Project key new tickets are created under and that ticket keys are matched against (PROJ-123).
#   project_key: PROJ
#   # Prefix for rendering a ticket key as a link: <base_url><KEY>.
#   base_url: https://acme.atlassian.net/browse/

# Epics offered as suggestions when a ticket is created — suggestions only, never auto-applied.
# A living list, grown in place as epics are confirmed with you; never pre-populate guesses.
#   - key: PROJ-100
#     name: Example initiative
preferred_epics: []

slack:
  # Channel ax-pr-review-request posts review requests to, e.g. "#pr-review".
  # null/absent disables that skill (it will say so and explain how to enable it).
  pr_review_channel: null

ci:
  # The PR-comment string ax-babysit-prs posts to trigger a deploy, e.g. "/deploy".
  # null disables that step entirely: ax-babysit-prs reports readiness and stops there.
  deploy_trigger_comment: null

# Workflow statuses a task (ax-tasks) can be in. Each entry:
#   key    — what gets written in a task file's `status:` frontmatter and in TASKS.md's Status
#            column. Keep it short, lowercase, no spaces (e.g. in-progress). Renaming a key later
#            doesn't rewrite existing tasks, so pick keys you're happy to keep.
#   label  — human-readable name the skills use in chat and reports.
#   closed — true marks a finished status: tasks in it live in TASKS.md's Completed table and get a
#            Completed date. Omit (or false) for statuses that are still in play (the Open table).
# Order matters: the FIRST entry is the default status for new tasks, and the list order is the
# order statuses are grouped/shown in. At least one closed and one non-closed status are required.
# Statuses are never tags — they don't go into a task's `tags:`.
# Colors are not configured here: they're a viewer-only setting. The local viewer (webapp/) has
# built-in colors for the four defaults, shows any other status in gray, and lets you change colors
# (and which statuses count as closed there) in its Settings, stored per browser.
# If this key is absent, every skill uses exactly these four defaults.
task_statuses:
  - { key: backlog,     label: Backlog }
  - { key: in-progress, label: In progress }
  - { key: done,        label: Done,        closed: true }
  - { key: dropped,     label: Dropped,     closed: true }

# Repos at the workspace root that ax-* skills should never manage/report on/nudge about
# (archived, unrelated, someone else's scratch clone, etc.) — as opposed to a repo that's simply not
# tagged yet, which the ax-setup skill will ask about instead of silently ignoring.
ignored_repos: []

# domain -> repos it typically maps to, for ax-notes frontmatter tagging, e.g.
#   backend: [api-gateway, billing-service]
#   frontend: [web-app, mobile-app]
# Populate this by running the ax-setup skill, which scans the workspace root for cloned repos
# and, for any repo that's neither here nor in ignored_repos above, asks you to tag it or ignore it
# (suggesting tags based on name/stack similarity to domains you've already used).
domain_taxonomy: {}

# Optional: the ax-pr-review auto-reviewer (tools/check-pending-pr-reviews --review and
# tools/pr-review.sh). Every key has a default, so the whole section can be omitted. Its
# spend ledger is <notes repo>/pr-reviews-ledger.jsonl (tracked); local state (clone cache, logs) is
# in <notes repo>/.state/pr-review/.
pr_review:
  self_github_login: null      # your GitHub login (default: `gh api user`)
  review_model: opus           # model for the headless /code-review run
  review_level: high           # /code-review effort level (low | medium | high | xhigh | max)
  per_review_budget_usd: 8     # hard cap per review (claude --max-budget-usd)
  monthly_budget_usd: 100      # hard cap per calendar month across all reviews (dry runs included)

# Optional: which tools run on a schedule (tools/schedule.sh; launchd on macOS, cron elsewhere).
# One line per job: `off`, or `every <N>m|<N>h` (1m to 24h) optionally followed by an hours window
# `HH:MM-HH:MM` and `weekdays` (Mon-Fri). Written by install.sh, "configure schedules"
# (ax-schedules) and `schedule.sh set`; after editing by hand, run `schedule.sh apply`.
# Logs: <notes repo>/.state/schedules/<job>.log.
schedules:
  snapshot-agents: every 1m                       # AGENTS.json for the viewer's Agents view
  check-prs: every 30m                            # reconcile PRS.md with GitHub
  pr-review: every 30m 09:00-18:00 weekdays       # check-pending-pr-reviews --review (costs per review)
  clean-worktrees: off                            # clean-merged-worktrees.sh --delete

# Optional: ax-babysit-prs behaviour. Every key below is off/unset by default, and with it unset
# the skill behaves exactly as before. Per-PR loop state lives in
# <notes repo>/.state/babysit/<owner>-<repo>-<n>.json (untracked), not in config.
#
# review:
#   # Extra bot reviewers besides any login ending in "[bot]". Their latest review body (nitpicks,
#   # "outside the diff", "actionable comments") is treated like unresolved comments: fixed if
#   # sound, and answered on the PR.
#   bots: [reviewbot]
#   # Re-request a stale bot review. Posted when a bot's latest review is CHANGES_REQUESTED (or it
#   # skipped / was rate limited), all its threads are resolved and no newer review exists; then
#   # repeated every `every_min` until the bot approves or comments. Unset = never. For CodeRabbit
#   # use "@coderabbitai full review": a plain "review" does not re-review already-reviewed commits.
#   bot_rerequest: {comment: "@coderabbitai full review", every_min: 30}
#
# ci:                 # (add these to the `ci:` block above; don't repeat the key)
#   # Name of the merge-gate check whose output explains unmet requirements (approvals, CODEOWNERS).
#   # The report then says "needs 1 more review" instead of "CI failing", and a gate failing only
#   # on approvals is never rerun or treated as a CI failure.
#   gate_check: "CI Gate"
#   # --- deploy comment policy (applies only when deploy_trigger_comment is set) ---
#   deploy_policy: ask               # ask (default) | auto_after_ready; at most one per head SHA
#   deploy_excluded_repos: []        # repos where the deploy comment is never posted
#   deployed_label: "deployed"       # PR already carries it => deploy comment skipped
#   post_deploy_checks: {}           # repo -> skill that observes its deploy (e.g. my-repo: my-deploy-observability); PR not ready to merge until it ran clean on the head
#   # A check whose output says no services are affected (a dependency-only PR) => no deploy comment.
#   no_services_check: {check: "Affected services", pattern: "no services affected"}
#   # --- environment lock (both unset = off) ---
#   lock_label: "blocked:env-in-use"     # our PR is waiting for the environment
#   holder_label: "env-in-use"           # the PR currently holding it
#   lock_notice_template: "Hi {author}, {holder_pr} holds the deploy environment and {our_pr} is waiting. Could you /rollback or share an ETA?"
#
# review:                # (merge into the `review:` block above)
#   ready_label: "ready-to-be-reviewed"  # a PR is ready only with this label on its current head;
#                                        # when missing, a ship/PR-readiness skill is run if available
#
# merge:
#   manual_repos: []         # repos the user merges by hand: never queued or suggested for merge
#   queue_file: null         # path relative to the notes repo; commands a guard blocked (marking a
#                            # PR ready, merging it) are appended there without the leading `gh`,
#                            # one per line, e.g. "pr merge 42 --repo acme/api"
#
# Review reminders, only inside office hours. Unset = off.
# reminders:
#   after_min: 60            # since the review request or the last reminder
#   tz: America/Argentina/Buenos_Aires
#   days: [Mon, Tue, Wed, Thu, Fri]
#   hours: "09:00-19:00"
#   template: "Gentle reminder: could someone take a look at {pr}? Pending: {owners} Thanks!"
#
# Post-merge hooks, run once when a babysat PR is seen merged. Unset = off; each sub-key optional.
# on_merge:
#   jira_done_transition: true     # needs the jira block; moves the PR's ticket to Done
#   check_cmd: "gh api repos/acme/{repo}/dependabot/alerts --jq '[.[]|select(.state==\"open\")]|length'"
#   slack_thread: {channel: "#alerts", ts: "1760000000.000100", template: "Closed: {pr} ({jira})"}

# Optional: shape of the Slack message ax-pr-review-request posts. Default `full`.
# `short` is one line, no summary: "Hey team :wave: could you please review <link|repo #n — title>?
# Pending code owners: <@…> Thanks! 🙏". Slack mentions come first from the optional
# <notes repo>/github-slack-people.yml (template: templates/github-slack-people.example.yml).
# review_request:
#   style: full            # full | short
