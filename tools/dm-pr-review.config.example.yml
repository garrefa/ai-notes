# dm-pr-review.config.example.yml — template for <workspace>/.dm-pr-review/config.yml, used by
# tools/dm-pr-review.sh (ainotes-dm-pr-review). Copied there on first use with self_github_login
# filled in from `gh api user`. Re-read on every run.

# Your GitHub login: used to tell whether you already approved a PR, and named in the review prompt.
self_github_login: CHANGE-ME
models:
  review: opus                 # model for the headless /code-review run
review:
  level: high                  # /code-review effort level (low | medium | high | xhigh | max)
  per_review_budget_usd: 8     # hard cap per review (claude --max-budget-usd)
budget:
  monthly_usd: 100             # hard cap per calendar month across all reviews (dry runs included)
